name: Load Testing Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'load-testing/**'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Load scenario to run'
        required: false
        default: 'all'
        type: choice
        options: [ all, baseline, normal, stress, spike ]
      base_url:
        description: 'Override BASE_URL (leave blank to use localhost)'
        required: false
        default: ''

jobs:
  load-test:
    name: Run Load Test Suite (300 Checks)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Meditation_web/package-lock.json'

      - name: 3. Install & Build React Application
        run: |
          cd Meditation_web
          npm ci
          npm run build
          echo "✅ Application build complete"

      - name: 4. Start Preview Server
        run: |
          cd Meditation_web
          npm run preview -- --port 5173 &
          npx wait-on http://localhost:5173 --timeout 30000
          echo "✅ Application is live at http://localhost:5173"

      - name: 5. Verify Application Health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/)
          echo "Root route HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Application health check failed — status $STATUS"
            exit 1
          fi
          echo "✅ Application health check passed"

      - name: 6. Execute Load Tests (300 Checks)
        env:
          BASE_URL:     ${{ github.event.inputs.base_url || 'http://localhost:5173' }}
          SCENARIO:     ${{ github.event.inputs.scenario || 'all' }}
          # Scale down for CI to keep runtime reasonable
          BASELINE_USERS: '5'
          BASELINE_LOOPS: '2'
          NORMAL_USERS:   '15'
          NORMAL_LOOPS:   '1'
          STRESS_USERS:   '30'
          STRESS_LOOPS:   '1'
          SPIKE_USERS:    '50'
          SPIKE_LOOPS:    '1'
          THINK_TIME:     '500'
          REQUEST_TIMEOUT: '10000'
          PASS_THRESHOLD:  '95'
        run: |
          cd load-testing
          echo "Running load test scenario: $SCENARIO"
          node run.js --scenario $SCENARIO
          echo "::notice title=Load Test Complete::300 checks executed. See HTML artifact for full report."

      - name: 7. Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Load_Test_HTML_Report
          path: load-testing/results/load-test-report.html
          retention-days: 30

      - name: 8. Upload CSV Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Load_Test_CSV_Reports
          path: |
            load-testing/results/check-results.csv
            load-testing/results/route-stats.csv
          retention-days: 30

      - name: 9. Print Summary to Actions Log
        if: always()
        run: |
          echo "==================================================="
          echo "  CogniSync Load Test — GitHub Actions Summary"
          echo "==================================================="
          node -e "
          try {
            const fs = require('fs');
            const csv = fs.readFileSync('load-testing/results/check-results.csv', 'utf8');
            const lines = csv.split('\n').slice(1).filter(Boolean);
            const total = lines.length;
            const passing = lines.filter(l => l.includes(',PASS')).length;
            const degraded = lines.filter(l => l.includes(',DEGRADED')).length;
            const failing = lines.filter(l => l.includes(',FAIL')).length;
            console.log('Total Checks  : ' + total);
            console.log('Passing       : ' + passing);
            console.log('Degraded      : ' + degraded + ' (performance thresholds under stress)');
            console.log('Failing       : ' + failing);
            console.log('Pass Rate     : ' + ((passing/total)*100).toFixed(1) + '%');
            if (failing > 0) {
              console.log('');
              console.log('FAILED CHECKS:');
              lines.filter(l => l.includes(',FAIL')).slice(0, 20).forEach(l => {
                const parts = l.split(',');
                console.log('  FAIL: ' + parts[0] + ' - ' + parts[4]);
              });
            }
          } catch(e) { console.log('Could not parse CSV: ' + e.message); }
          " || true
          echo "==================================================="

      - name: 10. Push Results to Branch for Debugging
        if: always()
        run: |
          git config --global user.name "load-test-bot"
          git config --global user.email "load-test-bot@github.com"
          git checkout -b load-test-results || git checkout load-test-results
          mkdir -p ci-results
          cp load-testing/results/check-results.csv ci-results/check-results.csv
          cp load-testing/results/route-stats.csv ci-results/route-stats.csv
          git add ci-results/
          git commit -m "Upload CI load test results"
          git push origin load-test-results --force
