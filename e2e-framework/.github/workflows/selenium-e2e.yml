name: Selenium E2E Test Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-selenium-tests:
    name: Run Selenium E2E Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Meditation_web/package-lock.json'

      - name: 3. Install React Application Dependencies & Build
        run: |
          cd Meditation_web
          npm ci
          npm run build

      - name: 4. Start React Web Application Server
        run: |
          cd Meditation_web
          npm run preview -- --port 5173 &
          npx wait-on http://localhost:5173 --timeout 30000

      - name: 5. Install E2E Automation Framework Dependencies
        run: |
          cd e2e-framework
          npm ci

      - name: 6. Execute Selenium End-to-End Tests
        env:
          BASE_URL: 'http://localhost:5173'
          BROWSER: ${{ matrix.browser }}
          HEADLESS: 'true'
        run: |
          cd e2e-framework
          npm run test

      - name: 7. Upload Excel E2E Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E_Excel_Report_${{ matrix.browser }}
          path: e2e-framework/excel/E2E_Report.xlsx
          retention-days: 30

      - name: 8. Upload Mochawesome HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mochawesome_HTML_Report_${{ matrix.browser }}
          path: e2e-framework/reports/html/
          retention-days: 30

      - name: 9. Upload Failure Screenshots & Logs Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test_Failures_And_Logs_${{ matrix.browser }}
          path: |
            e2e-framework/reports/failures/
            e2e-framework/screenshots/
            e2e-framework/logs/
          retention-days: 30
